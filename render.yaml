# Render Blueprint: New + > Blueprint, pick this repo. Fill the "sync: false" values when prompted.
services:
  - type: web
    name: korafi
    runtime: docker
    plan: starter            # free tier sleeps; USSD needs an always-on service
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: korafi-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: WEBHOOK_KEY
        generateValue: true
      - key: PUBLIC_URL      # e.g. https://korafi.onrender.com (set after first deploy)
        sync: false
      - key: BUSINESS_NAME
        value: Kano Water Board
      - key: USSD_CODE
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: SUPPORTED_AREAS
        value: Kabuga,Hotoro,Tarauni,Sabon Gari
databases:
  - name: korafi-db
    plan: basic-256mb
